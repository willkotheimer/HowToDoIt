trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  buildConfiguration: Release

stages:

  # ── .NET API: build, test, publish ───────────────────────────────────────────
  - stage: BackendCI
    displayName: .NET API — Build & Test
    jobs:
      - job: BuildAndTest
        displayName: dotnet build / test / publish
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: UseDotNet@2
            displayName: Use .NET 8.0
            inputs:
              version: 8.x

          - script: dotnet restore
            displayName: dotnet restore
            workingDirectory: HouseHoldApp

          - script: dotnet build --no-restore --configuration $(buildConfiguration)
            displayName: dotnet build
            workingDirectory: HouseHoldApp

          - script: >
              dotnet test --no-build --configuration $(buildConfiguration)
              --logger trx
              --results-directory $(Agent.TempDirectory)/TestResults
            displayName: dotnet test
            workingDirectory: HouseHoldApp

          - task: PublishTestResults@2
            displayName: Publish xUnit results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'

          - script: >
              dotnet publish HouseHoldApp/HouseHoldApp.csproj --no-build --configuration $(buildConfiguration)
              --output $(Build.ArtifactStagingDirectory)/api
            displayName: dotnet publish
            workingDirectory: HouseHoldApp

          - publish: $(Build.ArtifactStagingDirectory)/api
            displayName: Publish API artifact
            artifact: api

  # ── React: unit tests, build, Playwright ─────────────────────────────────────
  - stage: FrontendCI
    displayName: React — Build & Test
    dependsOn: []
    jobs:
      - job: BuildAndTest
        displayName: npm ci / vitest / build / playwright
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: NodeTool@0
            displayName: Use Node 22
            inputs:
              versionSpec: 22.x

          - script: npm ci
            displayName: npm ci
            workingDirectory: HouseholdApp.ui

          - script: npm test
            displayName: Vitest unit tests
            workingDirectory: HouseholdApp.ui

          - task: PublishTestResults@2
            displayName: Publish Vitest results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: HouseholdApp.ui/vitest-results/results.xml

          - script: npm run build
            displayName: Build production bundle
            workingDirectory: HouseholdApp.ui
            env:
              # Entra External ID config baked into the SPA bundle at build time.
              # Values are defined as pipeline variables (or a variable group), not committed.
              VITE_ENTRA_TENANT_ID: $(VITE_ENTRA_TENANT_ID)
              VITE_ENTRA_AUTHORITY: $(VITE_ENTRA_AUTHORITY)
              VITE_ENTRA_CLIENT_ID: $(VITE_ENTRA_CLIENT_ID)
              VITE_ENTRA_API_SCOPE: $(VITE_ENTRA_API_SCOPE)

          - script: npx playwright install --with-deps chromium
            displayName: Install Playwright + Chromium deps
            workingDirectory: HouseholdApp.ui

          - script: node_modules/.bin/serve -s build -l 3000 &
            displayName: Serve production build
            workingDirectory: HouseholdApp.ui

          - script: |
              npx wait-on http://localhost:3000 --timeout 60000
            displayName: Start and Wait for server
            workingDirectory: HouseholdApp.ui

          - script: npm run test:e2e
            displayName: Playwright smoke tests
            workingDirectory: HouseholdApp.ui
            env:
              CI: true

          - task: PublishTestResults@2
            displayName: Publish Playwright results
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: HouseholdApp.ui/playwright-results/results.xml

          - publish: HouseholdApp.ui/build
            displayName: Publish frontend artifact
            artifact: frontend

  # ── Provision Azure infrastructure via Bicep ─────────────────────────────────
  - stage: ProvisionInfra
    displayName: Provision Azure Infrastructure
    dependsOn: BackendCI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: Provision
        displayName: bicep deployment
        pool:
          vmImage: ubuntu-latest
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: Deploy Bicep template
                  inputs:
                    azureSubscription: azure-service-connection
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      az deployment group create \
                        --resource-group VisualStudioOnline-11AB64F55986464694EB75A9DB70913A \
                        --template-file infra/main.bicep \
                        --mode Incremental

  # ── Deploy API to Azure App Service ──────────────────────────────────────────
  - stage: DeployAPI
    displayName: Deploy API
    dependsOn: ProvisionInfra
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployAPI
        displayName: Azure App Service deploy
        pool:
          vmImage: ubuntu-latest
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@1
                  displayName: Deploy to App Service
                  inputs:
                    azureSubscription: azure-service-connection
                    appType: webAppLinux
                    appName: household-api
                    package: $(Pipeline.Workspace)/api
                    startUpCommand: 'dotnet HouseHoldApp.dll'
                    appSettings: -WEBSITE_RUN_FROM_PACKAGE 1 -SCM_DO_BUILD_DURING_DEPLOYMENT false -ConnectionStrings__DefaultConnection "$(SQL_CONNECTION_STRING)"

  # ── Deploy frontend to Azure Static Web Apps ─────────────────────────────────
  - stage: DeployFrontend
    displayName: Deploy Frontend
    dependsOn: FrontendCI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployFrontend
        displayName: Azure Static Web Apps deploy
        pool:
          vmImage: ubuntu-latest
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: DownloadPipelineArtifact@2
                  inputs:
                    artifact: frontend
                    targetPath: $(Build.SourcesDirectory)/frontend

                - task: AzureStaticWebApp@0
                  displayName: Deploy to Static Web Apps
                  inputs:
                    azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN)
                    app_location: frontend
                    skip_app_build: true
